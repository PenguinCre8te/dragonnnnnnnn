name: "Build iOS (Sideload)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.3" 
      EXPORT_PRESET: "iOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          mv "$APP_NAME" /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Godot Export (Files Only)
        run: |
          mkdir -p build/ios/export
          GODOT_EXEC=$(find /Applications/Godot.app/Contents/MacOS -type f -maxdepth 1 -print -quit)
          
          # The trick: Export to a folder path without a .zip extension first
          # Then we rename/move if needed. 
          # We use --no-window to ensure no GUI interference
          $GODOT_EXEC --headless --path . --export-debug "${{ env.EXPORT_PRESET }}" build/ios/export/project.ipa || true
          
          # Even if it "fails" the signing/archiving step, the source files 
          # are usually already dumped into the directory.
          # We check if the xcodeproj exists.
          ls -R build/ios/export

      - name: Build Unsigned
        run: |
          cd build/ios/export
          
          # Find the project file Godot just dumped
          PROJECT_FILE=$(find . -name "*.xcodeproj" -print -quit)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          # Manually trigger the build, ignoring the failed 'archive' from Godot
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          cd build/ios/export
          mkdir -p Payload
          # Copy the .app from the build folder
          cp -r build/Debug-iphoneos/*.app Payload/ 2>/dev/null || cp -r *.app Payload/
          zip -r ../../dragon_sideload.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ios-sideload
          path: dragon_sideload.ipa
