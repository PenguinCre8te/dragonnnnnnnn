name: "Build iOS (Sideload)"
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.6" # Ensure this matches your version
      EXPORT_PRESET: "iOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot Export (Files Only)
        run: |
          mkdir -p build/ios
          # Exporting to a directory/project, not an .ipa, prevents the signing check
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-debug "${{ env.EXPORT_PRESET }}" build/ios/xcode_project

      - name: Build Unsigned App with xcodebuild
        run: |
          # Navigate to where Godot dropped the Xcode files
          cd build/ios
          
          # Force Xcode to ignore all signing and provisioning requirements
          xcodebuild build \
            -project game.xcodeproj \
            -scheme "game" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package for Sideloading
        run: |
          cd build/ios
          mkdir -p Payload
          # Move the compiled .app into the Payload folder
          cp -r build/Release-iphoneos/game.app Payload/ 2>/dev/null || cp -r build/Debug-iphoneos/game.app Payload/
          zip -r ../dragon_sideload.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ios-sideload
          path: build/dragon_sideload.ipa
