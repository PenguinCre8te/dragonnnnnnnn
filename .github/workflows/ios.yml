name: "Build iOS (Sideload)"
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.6" # Ensure this matches your version
      EXPORT_PRESET: "iOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          # Setup Export Templates
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          # This exports the .xcodeproj folder to build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-debug "${{ env.EXPORT_PRESET }}" build/ios/game.xcodeproj

      - name: Build IPA (Ad-Hoc/Unsigned)
        run: |
          cd build/ios
          # Use xcodebuild to create the binary without needing a signing identity
          xcodebuild build \
            -project game.xcodeproj \
            -scheme "game" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Create a dummy Payload folder to wrap it into an .ipa format
          mkdir -p Payload
          cp -r build/Debug-iphoneos/game.app Payload/
          zip -r ../game_sideload.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-package
          path: build/game_sideload.ipa
