name: "Build iOS (Sideload)"
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.6" # Ensure this matches your version
      EXPORT_PRESET: "iOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
                # Download Godot
                wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
                unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
                
                # Find the .app folder and move it to a predictable location
                APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
                mv "$APP_NAME" /Applications/Godot.app
                
                # Setup Export Templates
                mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
                wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
                unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
                mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Godot Export (Files Only)
        run: |
          mkdir -p build/ios
          # Use 'find' to get the exact binary path inside the app bundle
          GODOT_EXEC=$(find /Applications/Godot.app/Contents/MacOS -type f -maxdepth 1 -print -quit)
          
          # We export to a folder name, NOT a .ipa or .xcodeproj filename
          # This tells Godot to just dump the Xcode project files
          $GODOT_EXEC --headless --path . --export-debug "${{ env.EXPORT_PRESET }}" build/ios/
      - name: Build Unsigned App with xcodebuild
        run: |
          # Navigate to where Godot dropped the Xcode files
          cd build/ios
          
          # Force Xcode to ignore all signing and provisioning requirements
          xcodebuild build \
            -project game.xcodeproj \
            -scheme "game" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package for Sideloading
        run: |
          cd build/ios
          mkdir -p Payload
          # Move the compiled .app into the Payload folder
          cp -r build/Release-iphoneos/game.app Payload/ 2>/dev/null || cp -r build/Debug-iphoneos/game.app Payload/
          zip -r ../dragon_sideload.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ios-sideload
          path: build/dragon_sideload.ipa
