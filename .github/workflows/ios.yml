name: "Build iOS (Sideload)"

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.6" # Update this to match your project version
      EXPORT_PRESET: "iOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        run: |
          # Download Godot Engine
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          
          # Move .app to /Applications and find the binary path
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -print -quit)
          mv "$APP_NAME" /Applications/Godot.app
          
          # Setup Export Templates
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          wget https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Godot Export (Source Only)
        run: |
          mkdir -p build/ios
          # Find the exact binary inside the .app bundle
          GODOT_EXEC=$(find /Applications/Godot.app/Contents/MacOS -type f -maxdepth 1 -print -quit)
          
          # Export to .zip to bypass Godot's internal archive/signing attempt
          $GODOT_EXEC --headless --path . --export-debug "${{ env.EXPORT_PRESET }}" build/ios/project_files.zip

      - name: Unzip and Build Unsigned
        run: |
          cd build/ios
          unzip project_files.zip
          
          # Dynamically find the project file and scheme name
          PROJECT_FILE=$(find . -name "*.xcodeproj" -print -quit)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Building project: $PROJECT_FILE with scheme: $SCHEME_NAME"
          
          # Build the .app bundle without any signing certificates
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          
          # Move the compiled .app into the Payload folder
          # This handles various possible output paths from xcodebuild
          cp -r build/Debug-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/*.app Payload/ 2>/dev/null || cp -r *.app Payload/
          
          # Zip the Payload into an IPA
          zip -r ../dragon_sideload.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ios-sideload
          path: build/dragon_sideload.ipa
